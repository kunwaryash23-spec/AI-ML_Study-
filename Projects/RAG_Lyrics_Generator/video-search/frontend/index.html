<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0B0C0D" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Video Search — Find anything inside a video</title>
    <meta
      name="description"
      content="Search inside a recording's transcript and jump straight to the timestamp where it was said."
    />
  </head>
  <body>
    <!--
      THESIS: A search result here is a *position in a recording*, not a passage
      of text. The page refuses the category default of a centered search box
      over a list of quotations: the found moments land on the recording's own
      timeline, so you read where they are before you read what they say.

      OWN-WORLD: The edit suite. Graphite panels (#0B0C0D / #101113 / #16181B),
      warm paper type (#F2EFE9), and exactly one colour — amber #FFB020 — which
      is never decoration: it marks position and nothing else. Archivo for
      voice, Martian Mono tabular for every timecode. Rounded 20-24px panels,
      hairline rules, film-grain wash, ruler ticks. No neon, no glow, no chart.

      STORY: You already know a phrase. You type it, moments pin themselves to
      the timeline, and you press one to play from there.

      FIRST VIEWPORT: Hairline top rail with the wordmark. A left-aligned
      display line, "Find anything inside a video.", at 60-68px. Below it the
      recording deck — metadata row, then the waveform/ruler ribbon that owns
      the composition's width. The amber search field sits directly under the
      deck as the primary action. Results begin below the fold. On search the
      display line springs away and the deck rises to the top.

      FORM: Pinned by the brief (dark media surface + the two supplied
      component references); no concept roll was run.

      FINISH: unreviewed and undocumented is unfinished; this build ends with
      the finish review, the verdict, and DESIGN.md
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
